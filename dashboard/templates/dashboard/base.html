{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .wrapper {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: #000;
            color: #fff;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar h2 {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #222;
            font-size: 20px;
        }

        .sidebar a {
            display: block;
            padding: 14px 25px;
            color: #fff;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #222;
        }

        .content {
            flex: 1;
            margin-left: 240px;
            padding: 30px;
        }
    </style>
</head>

<body>

<div class="wrapper">

    <div class="sidebar">
        <h2>DASHBOARD</h2>
        <a href="{% url 'dashboard_home' %}">Home</a>
        <a href="{% url 'inventory_dashboard' %}">Inventory</a>
        <a href="{% url 'analysis' %}">Analysis</a>
        <a href="{% url 'news' %}">News</a>
        <a href="{% url 'report' %}">Reports</a>
    </div>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

</div>

</body>
</html>
