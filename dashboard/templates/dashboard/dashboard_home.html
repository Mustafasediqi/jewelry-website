{% extends 'dashboard/base.html' %}
{% load static %}

{% block content %}
<h1 style="text-align:center; margin:20px 0;">Home Preview</h1>

<div style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;">
    {% for item in items %}
    <div style="border: 1px solid #ccc; border-radius: 10px; padding: 15px; width: 200px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); text-align:center;">
        
        <!-- Item image -->
        <img 
            src="{% if item.image %}{{ item.image.url }}{% else %}{% static 'images/mm.jpg' %}{% endif %}" 
            alt="{{ item.name|default:'No Image' }}" 
            style="width: 100%; height: 150px; object-fit: cover; border-radius: 8px;"
        >

        <!-- Item name -->
        <h3 style="margin: 10px 0 5px 0;">{{ item.name|default:'No Name' }}</h3>
        <!-- Item price -->
        <p style="color: #555; font-weight: bold;">${{ item.price|default:'0.00' }}</p>
    </div>
    {% empty %}
        <p>No items available.</p>
    {% endfor %}
</div>
{% endblock %}
