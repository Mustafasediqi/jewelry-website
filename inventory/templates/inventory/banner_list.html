{% extends 'inventory/base.html' %}
{% load static %}

{% block content %}
<h2>Banners Dashboard</h2>
<a href="{% url 'banner_add' %}" class="btn btn-success" style="margin-bottom: 20px;">Add New Banner</a>

<div style="display: flex; flex-wrap: wrap; gap: 20px;">
    {% for banner in banners %}
    <div style="border: 1px solid #ddd; padding: 10px; width: 220px; text-align: center;">
        <img src="{{ banner.image.url }}" alt="{{ banner.name }}" style="width:100%; height:150px; object-fit:cover;">
        <h5>{{ banner.name }}</h5>
        <p>Type: {{ banner.banner_type }}</p>
        <a href="{% url 'banner_edit' banner.pk %}" class="btn btn-primary btn-sm">Edit</a>
        <form action="{% url 'banner_delete' banner.pk %}" method="post" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
        </form>
    </div>
    {% empty %}
    <p>No banners found.</p>
    {% endfor %}
</div>
{% endblock %}
